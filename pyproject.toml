[project]
name = "financial-market-intelligence"
version = "0.2.0"
description = "A Lightweight Financial Market Data Retrieval & Research Skill exposed as an MCP Server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Financial Market Intelligence" }]
keywords = ["finance", "market-data", "mcp", "yfinance", "akshare"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.12",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=1.7",
    "akshare>=1.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
financial-intelligence-mcp = "financial_intelligence.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: launches a real subprocess / talks to a live data source",
]

[tool.coverage.run]
source = ["financial_intelligence"]
