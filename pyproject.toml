[project]
name = "financial-market-intelligence"
version = "0.3.0"
description = "A Lightweight Financial Market Data Retrieval & Research Skill exposed as an MCP Server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ERos1on-Befound" }]
keywords = ["finance", "market-data", "mcp", "yfinance", "akshare", "plotly", "charts", "reports"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.12",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=1.7",
    "akshare>=1.20",
    "plotly>=7.1.0",
    "kaleido>=1.5.0",
    "markdown>=3.11.2",
]

[project.urls]
Homepage = "https://github.com/ERos1on-Befound/FMI-plugin"
Repository = "https://github.com/ERos1on-Befound/FMI-plugin"
Issues = "https://github.com/ERos1on-Befound/FMI-plugin/issues"
Changelog = "https://github.com/ERos1on-Befound/FMI-plugin/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.3",
]

[project.scripts]
financial-intelligence-mcp = "financial_intelligence.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: launches a real subprocess / talks to a live data source",
]

[tool.coverage.run]
source = ["financial_intelligence"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "outputs",
    "artifacts",
    "examples/images",
]

[tool.ruff.lint]
# 只启用确定性的规则集：语法错误、未使用导入、导入顺序。
# 格式化风格类规则（行宽、引号）交给 ruff format，不在 CI 里阻断。
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]
"scripts/**" = ["F401"]

