name: Bug report / 问题反馈
description: 报告可复现的错误、数据异常或与文档不一致的行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量提供**可复现**的信息。涉及数据问题时，请附上工具名、参数与返回中的 `data_status` / `error` 字段。
        安全相关请走 SECURITY.md 里的私密报告渠道，不要写在这里。
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 行情 / 历史行情（sina、akshare、yfinance）
        - 财务数据（SEC EDGAR、AKShare 镜像）
        - 公式引擎 / 指标计算
        - 基本面分析
        - 技术面分析
        - 图表生成
        - 分析报告
        - MCP 工具 / 启动
        - 文档 / Skill
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 工具或命令
      placeholder: "例如 get_company_financials('AAPL') 或 uv run pytest -q"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果（含报错或返回片段）
      description: 请粘贴完整报错，或用 ```json 包住返回的关键字段
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "Windows 11 / Python 3.12.16 / uv 0.13.6 / 项目版本 0.3.0"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有重复
          required: true
        - label: 这条 Issue 不包含任何凭据、Token 或私人路径
          required: true
